[tool.poetry]
name = "rlnoise"
version = "0.1.0"
description = "Quantum noise modeling through reinforcement learning"
authors = [
    "Simone Bordoni",
    "Andrea Papaluca",
    "Piergiorgio Buttarini",
    "Alejandro Sopena",
    "Stefano Giagu (coordinator)",
    "Stefano Carrazza (coordinator)",
]
readme = "README.md"
homepage = "https://github.com/qiboteam/rl-noisemodel"
repository = "https://github.com/qiboteam/rl-noisemodel"
license = "Apache-2.0"
packages = [{include = "rlnoise", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
qibo = "^0.2.7"
gymnasium = "^0.29.0"
numpy = "^2.0.0"
stable-baselines3 = "^2.0.0"
matplotlib = "^3.7.0"
tqdm = "^4.65.0"
rich = "^13.0.0"
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
isort = "^5.12.0"
mypy = "^1.4.0"
jupyter = "^1.0.0"
pylint = "^3.0.0"

[tool.poetry.group.hardware]
optional = true

[tool.poetry.group.hardware.dependencies]
# Add hardware-specific dependencies here when needed

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=rlnoise --cov-report=html --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
